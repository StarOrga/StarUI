name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild bundle
        run: node scripts/build.mjs
      - name: Verify dist/ is in sync with lib/
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/star-ui.css is stale — run 'npm run build' and commit the result."
            exit 1
          fi
